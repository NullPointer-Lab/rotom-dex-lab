<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 160 128">
  <rect x="0" y="0" width="160" height="128" rx="3" fill="#05070c"/>

  <!-- Grade/background subtle -->
  <rect x="1" y="1" width="158" height="126" rx="3" fill="none" stroke="#1f3b57" stroke-width="1"/>

  <!-- Mini Zapp face / RobotEyes-inspired -->
  <g id="zapp-face">
    <rect x="4" y="5" width="39" height="29" rx="8" fill="#072a55" stroke="#00d9ff" stroke-width="1"/>
    <rect x="10" y="13" width="12" height="9" rx="4" fill="#dffbff"/>
    <rect x="25" y="13" width="12" height="9" rx="4" fill="#dffbff"/>
    <circle cx="16" cy="17.5" r="2" fill="#05070c"/>
    <circle cx="31" cy="17.5" r="2" fill="#05070c"/>
    <path d="M15 27 Q23 31 32 27" fill="none" stroke="#00d9ff" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="80" y="18" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#00d9ff">ZAPP</text>

  <!-- Date left of center -->
  <g id="date-area">
    <text x="7" y="54" font-family="monospace" font-size="8" fill="#ffffff">06/06</text>
    <text x="10" y="65" font-family="monospace" font-size="8" fill="#ffffff">2026</text>
  </g>

  <!-- Main time center -->
  <text x="88" y="64" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#37ff64">12:34</text>

  <!-- Seconds right of center -->
  <text x="137" y="57" font-family="monospace" font-size="9" font-weight="700" fill="#fff35c">56</text>
  <text x="137" y="67" font-family="monospace" font-size="5" fill="#708090">seg</text>

  <!-- Reserved area below center -->
  <rect x="47" y="78" width="106" height="24" rx="5" fill="#09111f" stroke="#23466a" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="100" y="92" text-anchor="middle" font-family="monospace" font-size="6" fill="#6fa8dc">espaço reservado</text>

  <!-- Weather lower-left -->
  <g id="weather-area">
    <circle cx="13" cy="112" r="5" fill="#ffd43b"/>
    <line x1="13" y1="103" x2="13" y2="100" stroke="#ffd43b" stroke-width="1"/>
    <line x1="13" y1="121" x2="13" y2="124" stroke="#ffd43b" stroke-width="1"/>
    <line x1="4" y1="112" x2="1" y2="112" stroke="#ffd43b" stroke-width="1"/>
    <line x1="22" y1="112" x2="25" y2="112" stroke="#ffd43b" stroke-width="1"/>
    <text x="29" y="115" font-family="monospace" font-size="8" fill="#ffffff">28°C</text>
  </g>

  <!-- Labels for planning -->
  <text x="45" y="34" font-family="monospace" font-size="4.5" fill="#456">face canto sup. esq.</text>
  <text x="5" y="78" font-family="monospace" font-size="4.5" fill="#456">data</text>
  <text x="60" y="73" font-family="monospace" font-size="4.5" fill="#456">hora:minuto</text>
</svg>
